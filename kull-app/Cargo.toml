[package]
name = "kull-app"
description = "Kull Aegisub Renderer — Tauri backend (Rust) thay thế Electron main process."
version = "2.1.0"
edition = "2021"

[dependencies]
kull-engine = { path = "../kull-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros"] }
tauri = { version = "2" }

[build-dependencies]
tauri-build = { version = "2" }
