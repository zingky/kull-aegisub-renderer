[package]
name = "kull-engine"
description = "Core render engine for Kull Aegisub Renderer (ported to Rust): ffprobe, FFmpeg command builder, VSFilter/AviSynth + libass subtitle plan, progress parsing, encoder GPU probing, trim clip."
version = "2.1.0"
edition = "2021"
authors = ["Kull Aegisub"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
